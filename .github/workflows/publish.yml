name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check version against npm registry
        id: check_version
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "Package: $PACKAGE_NAME"
          echo "Local version: $LOCAL_VERSION"

          REGISTRY_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo "none")
          echo "Registry version: $REGISTRY_VERSION"

          if [ "$LOCAL_VERSION" = "$REGISTRY_VERSION" ]; then
            echo "Version $LOCAL_VERSION is already published on npm. Skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected ($LOCAL_VERSION != $REGISTRY_VERSION). Ready to publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check_version.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
