name: Publish Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check version status
        id: check_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")

          echo "Local Version: $VERSION"
          echo "Package: $PKG_NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # 1. Check npmjs.com
          NPM_REG_VER=$(npm view "$PKG_NAME" version 2>/dev/null || echo "none")
          echo "npm registry version: $NPM_REG_VER"
          if [ "$VERSION" != "$NPM_REG_VER" ]; then
            echo "publish_npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_npm=false" >> "$GITHUB_OUTPUT"
          fi

          # 2. Check GitHub Packages (requires authentication to query)
          npm config set @gideon-jacob:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken "${GITHUB_TOKEN}"

          GHP_REG_VER=$(npm view "$PKG_NAME" version 2>/dev/null || echo "none")
          echo "GitHub Packages version: $GHP_REG_VER"
          if [ "$VERSION" != "$GHP_REG_VER" ]; then
            echo "publish_ghp=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_ghp=false" >> "$GITHUB_OUTPUT"
          fi

      # 1. Publish to public npm (npmjs.com) if NPM_TOKEN is provided
      - name: Publish to npmjs.com
        if: steps.check_version.outputs.publish_npm == 'true' && env.HAS_NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          npm publish --access public

      # 2. Publish to GitHub Packages (npm.pkg.github.com) -> Shows in GitHub "Packages"
      - name: Publish to GitHub Packages
        if: steps.check_version.outputs.publish_ghp == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm config set @gideon-jacob:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken "${NODE_AUTH_TOKEN}"
          npm publish
